[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rqdata-hk-depth-snapshots"
version = "0.1.0"
description = "Probe, download, validate, reconcile, aggregate, and package RQData Hong Kong 10-level depth snapshots."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "python-dotenv>=1",
  "PyYAML>=6",
]

[project.optional-dependencies]
rqdata = [
  "rqdatac>=3.4.3,<3.5",
  "rqdatac-hk",
  "rqsdk",
]

[project.scripts]
rqdata-hk-depth = "rqdata_tick_data.cli:main_entry"
rqdata-tick = "rqdata_tick_data.cli:main_entry"

[dependency-groups]
dev = [
  "pytest>=8",
  "pyright>=1.1.390",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rqdata_tick_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "rqdata_live: optional live RQData smoke tests that require credentials and opt-in",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["project_tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RET", "PT", "RUF100"]

[tool.pyright]
include = [
  "src/rqdata_tick_data/assets.py",
  "src/rqdata_tick_data/audit.py",
  "src/rqdata_tick_data/cli.py",
  "src/rqdata_tick_data/compact.py",
  "src/rqdata_tick_data/download_state.py",
  "src/rqdata_tick_data/downloader.py",
  "src/rqdata_tick_data/exceptions.py",
  "src/rqdata_tick_data/fields.py",
  "src/rqdata_tick_data/progress.py",
  "src/rqdata_tick_data/quality.py",
  "src/rqdata_tick_data/quota.py",
  "src/rqdata_tick_data/raw_duplicates.py",
  "src/rqdata_tick_data/recompress.py",
  "src/rqdata_tick_data/release_assets.py",
  "src/rqdata_tick_data/runtime.py",
  "src/rqdata_tick_data/storage.py",
  "src/rqdata_tick_data/symbols.py",
]
exclude = ["project_tools", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"
